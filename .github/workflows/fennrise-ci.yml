name: Fennrise CI

on:
  pull_request:
    paths:
      - "Fennrise-Vercel-Ready/**"
      - ".github/workflows/fennrise-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Fennrise-Vercel-Ready/**"
      - ".github/workflows/fennrise-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fennrise-Vercel-Ready

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fennrise-Vercel-Ready/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
